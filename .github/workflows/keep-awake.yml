name: Keep Atlas API awake

# Render's free tier sleeps after 15 idle minutes and takes ~50 s to wake.
# A light ping every 5 minutes keeps the instance warm so voice replies stay
# fast. The endpoint is public and returns a tiny JSON body.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 55 \
              https://atlas-7-api.onrender.com/api/health || true)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Atlas API did not answer in time"
          exit 1
